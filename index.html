<style>

<body>

<div class="hud">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 随机 / 噪声 工具
   ========================================================= */
let _seed = 20261027;
function rnd()  { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
function rr(a, b) { return a + (b - a) * rnd(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct = 4) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2; amp *= 0.5; }
  return s;
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth  = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* =========================================================
   1. 地形高度场（中央平缓，远处隆起）
   ========================================================= */
function terrainHeight(x, z) {
  const base = (fbm(x * 0.17 + 51.3, z * 0.17 + 21.7, 4) - 0.5) * 0.66;
  const wave = Math.sin(x * 0.26 + 1.1) * Math.cos(z * 0.23 - 0.7) * 0.11;
  const r    = Math.hypot(x * 0.9, z * 0.9);
  const rim  = smooth(12, 30, r) * (fbm(x * 0.085 + 9.1, z * 0.085 + 3.3, 3) * 3.4 - 0.4);
  return base + wave + rim;
}

/* =========================================================
   2. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance', stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe3cfa4, 22, 66);

const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.08, 400);
camera.position.set(10.5, 4.6, 14.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.0, 1.5, 0.9);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.2;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.492;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.zoomSpeed = 0.85;
controls.update();

/* =========================================================
   3. 天空 / 环境贴图（清晨）
   ========================================================= */
function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#48789f');
  g.addColorStop(0.20, '#7fa4c2');
  g.addColorStop(0.36, '#b6cbd4');
  g.addColorStop(0.455, '#e3decd');
  g.addColorStop(0.50, '#d5cfbb');   // 地平线 ≈ 雾色
  g.addColorStop(0.55, '#e6d6b2');
  g.addColorStop(0.63, '#b9a480');
  g.addColorStop(0.80, '#6d5c42');
  g.addColorStop(1.00, '#3a2f22');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 512);

  // 太阳与光晕
  const sx = 258, sy = 168;
  const rg = x.createRadialGradient(sx, sy, 0, sx, sy, 340);
  rg.addColorStop(0.00, 'rgba(255,251,235,1)');
  rg.addColorStop(0.04, 'rgba(255,240,200,0.95)');
  rg.addColorStop(0.13, 'rgba(255,225,165,0.55)');
  rg.addColorStop(0.42, 'rgba(255,208,150,0.14)');
  rg.addColorStop(1.00, 'rgba(255,200,140,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 1024, 512);

  // 稀薄云带
  for (let i = 0; i < 26; i++) {
    const cy = rr(40, 210), cx = rr(0, 1024);
    const cw = rr(80, 320), ch = rr(6, 20);
    const cg = x.createRadialGradient(cx, cy, 0, cx, cy, cw);
    cg.addColorStop(0, `rgba(255,250,245,${rr(0.05, 0.16)})`);
    cg.addColorStop(1, 'rgba(255,250,245,0)');
    x.save(); x.translate(cx, cy); x.scale(1, ch / cw); x.translate(-cx, -cy);
    x.fillStyle = cg; x.beginPath(); x.arc(cx, cy, cw, 0, 6.2832); x.fill(); x.restore();
  }

  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const skyTex = makeSkyTexture();
scene.background = skyTex;

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(skyTex).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();

/* =========================================================
   4. 光照 —— 低角度晨光
   ========================================================= */
const sun = new THREE.DirectionalLight(0xffc07a, 4.6);
sun.position.set(-15, 9.5, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0012;
sun.shadow.normalBias = 0.055;
sun.shadow.radius = 3;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(1, 0, 2);

// 天光（冷色上方 / 暖色地面反弹）
const hemi = new THREE.HemisphereLight(0xa8c6de, 0x6d5a3c, 1.45);
scene.add(hemi);

// 背光补光，勾出物体轮廓
const rim = new THREE.DirectionalLight(0xffe0b0, 0.55);
rim.position.set(14, 5, 16);
scene.add(rim);

// 极弱的冷色填充，避免暗部死黑
const fill = new THREE.DirectionalLight(0x9dc0e0, 0.28);
fill.position.set(6, 8, -10);
scene.add(fill);

/* =========================================================
   5. 程序化贴图
   ========================================================= */
/** 可平铺的地面贴图（泥土 + 苔藓 + 落叶碎屑） */
function makeGroundTexture(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');

  x.fillStyle = '#453322'; x.fillRect(0, 0, size, size);

  const wrapFill = (cx, cy, r, fill) => {
    for (const dx of [-size, 0, size]) {
      for (const dy of [-size, 0, size]) {
        const px = cx + dx, py = cy + dy;
        if (px + r < 0 || px - r > size || py + r < 0 || py - r > size) continue;
        x.fillStyle = fill;
        x.beginPath(); x.arc(px, py, r, 0, 6.2832); x.fill();
      }
    }
  };

  // 泥土颗粒与色块
  for (let i = 0; i < 1500; i++) {
    const l = rr(0.45, 1.15);
    wrapFill(rr(0, size), rr(0, size), rr(2, 20),
      `rgba(${(96 * l) | 0},${(70 * l) | 0},${(46 * l) | 0},${rr(0.10, 0.30).toFixed(3)})`);
  }
  // 苔藓斑（偏暗绿）
  for (let i = 0; i < 760; i++) {
    wrapFill(rr(0, size), rr(0, size), rr(3, 20),
      `rgba(${ri(40, 68)},${ri(62, 96)},${ri(26, 44)},${rr(0.12, 0.28).toFixed(3)})`);
  }
  // 细小枯叶碎屑
  for (let i = 0; i < 300; i++) {
    wrapFill(rr(0, size), rr(0, size), rr(1.5, 4.5),
      `rgba(${ri(120, 168)},${ri(88, 122)},${ri(48, 74)},${rr(0.16, 0.4).toFixed(3)})`);
  }
  // 高频颗粒
  const img = x.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 26;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/** 树皮贴图 */
function makeBarkTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#6a5140'; x.fillRect(0, 0, 256, 512);

  for (let i = 0; i < 430; i++) {
    const cx = Math.random() * 256, w = rr(1.5, 7), h = rr(90, 420), cy = Math.random() * 512;
    const l = rr(0.78, 1.22);
    x.fillStyle = `rgba(${(84 * l) | 0},${(64 * l) | 0},${(46 * l) | 0},${rr(0.10, 0.26).toFixed(2)})`;
    x.fillRect(cx, cy, w, h);
    if (cy + h > 512) x.fillRect(cx, cy - 512, w, h);
  }
  // 深色沟壑
  for (let i = 0; i < 170; i++) {
    const cx = Math.random() * 256, w = rr(1, 3.5), h = rr(80, 440), cy = Math.random() * 512;
    x.fillStyle = `rgba(26,18,11,${rr(0.12, 0.30).toFixed(2)})`;
    x.fillRect(cx, cy, w, h);
    if (cy + h > 512) x.fillRect(cx, cy - 512, w, h);
  }
  // 苔藓附着
  for (let i = 0; i < 90; i++) {
    const cx = Math.random() * 256, cy = Math.random() * 512, r = rr(3, 14);
    x.fillStyle = `rgba(${ri(50, 84)},${ri(78, 116)},${ri(34, 56)},${rr(0.12, 0.34).toFixed(2)})`;
    x.beginPath(); x.arc(cx, cy, r, 0, 6.2832); x.fill();
  }
  return c;
}

function texFromCanvas(cv, repeatX = 1, repeatY = 1, srgb = true) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const groundCanvas = makeGroundTexture(1024);
const groundMap  = texFromCanvas(groundCanvas, 30, 30);
const groundBump = texFromCanvas(groundCanvas, 30, 30, false);

/* =========================================================
   6. 地面
   ========================================================= */
const groundGeo = new THREE.PlaneGeometry(150, 150, 200, 200);
groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
  }
  groundGeo.computeVertexNormals();
}
const groundMat = new THREE.MeshStandardMaterial({
  map: groundMap,
  bumpMap: groundBump,
  bumpScale: 0.22,
  color: 0xffffff,
  roughness: 0.95,
  metalness: 0.0,
  envMapIntensity: 0.7
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);

/* =========================================================
   7. 蚂蚁路线
   ========================================================= */
const HOLE = new THREE.Vector3(4.15, 0, 0.45);
const PATH_PTS = [
  new THREE.Vector3(-14.0, 0, 5.30),
  new THREE.Vector3(-10.6, 0, 3.90),
  new THREE.Vector3(-7.60, 0, 5.10),
  new THREE.Vector3(-4.60, 0, 3.10),
  new THREE.Vector3(-2.10, 0, 4.10),
  new THREE.Vector3(0.40, 0, 2.35),
  new THREE.Vector3(2.40, 0, 1.60),
  new THREE.Vector3(3.15, 0, 1.05),
  new THREE.Vector3(3.62, 0, 0.72)
];
const antCurve = new THREE.CatmullRomCurve3(PATH_PTS, false, 'catmullrom', 0.4);
const PATH_LEN = antCurve.getLength();
const pathSamples = antCurve.getPoints(260);

function distToPath(x, z) {
  let m = Infinity;
  for (let i = 0; i < pathSamples.length; i++) {
    const p = pathSamples[i];
    const dx = p.x - x, dz = p.z - z;
    const d = dx * dx + dz * dz;
    if (d < m) m = d;
  }
  return Math.sqrt(m);
}

/* --- 蚁穴土丘的高度场：蚂蚁必须爬上去才能进洞 --- */
const MOUND_PROFILE = [
  [0.60, 0.66], [0.78, 1.02], [1.05, 1.05],
  [1.45, 0.82], [1.95, 0.48], [2.55, 0.16], [3.05, -0.05]
];
// 洞内漏斗（与 funnel 几何完全一致，蚂蚁沿此壁下潜）
const FUNNEL_PROFILE = [
  [0.60, 0.66], [0.56, 0.42], [0.48, 0.02],
  [0.40, -0.38], [0.32, -0.78], [0.27, -1.05]
];
function lerpProfile(prof, r, descending) {
  for (let i = 0; i < prof.length - 1; i++) {
    const [r0, h0] = prof[i];
    const [r1, h1] = prof[i + 1];
    const lo = Math.min(r0, r1), hi = Math.max(r0, r1);
    if (r >= lo && r <= hi) {
      const t = (r - r0) / (r1 - r0);
      return h0 + (h1 - h0) * t;
    }
  }
  return descending ? prof[prof.length - 1][1] : 0;
}
function moundHeight(r) {
  if (r >= 3.05) return 0;
  if (r <= 0.60) return lerpProfile(FUNNEL_PROFILE, r, true);
  return lerpProfile(MOUND_PROFILE, r, false);
}
const holeDist = (x, z) => Math.hypot(x - HOLE.x, z - HOLE.z);
/** 蚂蚁脚下真实的地表高度（含土丘） */
function surfaceHeight(x, z) {
  return terrainHeight(x, z) + moundHeight(holeDist(x, z));
}

/* =========================================================
   8. 大树
   ========================================================= */
const barkMap = texFromCanvas(makeBarkTexture(), 3, 2);
// 树干水平碰撞体：用于让丁达尔光束避开树干，避免"光穿树"
const TREE_COLLIDERS = [];
const barkMat = new THREE.MeshStandardMaterial({
  map: barkMap, color: 0xc9b39a, roughness: 0.94, metalness: 0.0,
  bumpMap: barkMap, bumpScale: 0.05
});

function buildTree(baseX, baseZ, scale = 1, twist = 0.7) {
  const tree = new THREE.Group();
  tree.position.set(baseX, terrainHeight(baseX, baseZ) - 0.15, baseZ);
  tree.scale.setScalar(scale);

  // --- 树干（旋转体 + 顶点扰动 + 弯曲）---
  const H = 25;
  const profile = [];
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    let r = 1.95 * (1 - t * 0.74);
    r *= 1 + Math.sin(t * 6.2 + 1.3) * 0.05;
    r += Math.pow(1 - t, 5) * 1.05;             // 根部外扩
    profile.push(new THREE.Vector2(Math.max(0.14, r), t * H));
  }
  const trunkGeo = new THREE.LatheGeometry(profile, 40);
  {
    const p = trunkGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const h = v.y / H;
      const n = (vnoise(v.x * 1.7 + 11, v.y * 1.15) - 0.5) * 0.14;
      const n2 = (vnoise(v.z * 1.7 + 31, v.y * 1.15) - 0.5) * 0.14;
      // 整体弯曲
      const bendX = Math.pow(h, 1.85) * 2.0 * Math.sin(twist);
      const bendZ = Math.pow(h, 1.85) * 2.0 * Math.cos(twist);
      p.setX(i, v.x + n + bendX);
      p.setZ(i, v.z + n2 + bendZ);
    }
    trunkGeo.computeVertexNormals();
  }
  const trunk = new THREE.Mesh(trunkGeo, barkMat);
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  tree.add(trunk);

  const topX = Math.pow(1, 1.85) * 1.35 * Math.sin(twist);
  const topZ = Math.pow(1, 1.85) * 1.35 * Math.cos(twist);

  // --- 树根 ---
  const rootCount = 6;
  for (let i = 0; i < rootCount; i++) {
    const a = (i / rootCount) * Math.PI * 2 + rr(-0.35, 0.35);
    const len = rr(3.0, 4.8);
    const pts = [
      new THREE.Vector3(0, 1.9, 0),
      new THREE.Vector3(Math.cos(a) * len * 0.30, 0.75, Math.sin(a) * len * 0.30),
      new THREE.Vector3(Math.cos(a) * len * 0.68, 0.18, Math.sin(a) * len * 0.68),
      new THREE.Vector3(Math.cos(a) * len, -0.22, Math.sin(a) * len)
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const rg = new THREE.TubeGeometry(curve, 18, rr(0.24, 0.38), 8, false);
    const root = new THREE.Mesh(rg, barkMat);
    root.castShadow = true;
    root.receiveShadow = true;
    tree.add(root);
  }

  // --- 树枝 ---
  const branchEnds = [];
  const branchCount = 9;
  for (let i = 0; i < branchCount; i++) {
    const hN  = rr(0.52, 0.94);
    const ang = (i / branchCount) * Math.PI * 2 + rr(-0.5, 0.5);
    const len = rr(4.2, 7.6) * (1.15 - hN * 0.42);
    const y0 = hN * H;
    const sx = Math.pow(hN, 1.85) * 2.0 * Math.sin(twist);
    const sz = Math.pow(hN, 1.85) * 2.0 * Math.cos(twist);
    const dirX = Math.cos(ang), dirZ = Math.sin(ang);
    const rise = rr(1.0, 2.4);
    const pts = [
      new THREE.Vector3(sx, y0, sz),
      new THREE.Vector3(sx + dirX * len * 0.34, y0 + rise * 0.55, sz + dirZ * len * 0.34),
      new THREE.Vector3(sx + dirX * len * 0.72, y0 + rise * 1.0, sz + dirZ * len * 0.72),
      new THREE.Vector3(sx + dirX * len, y0 + rise * 1.22, sz + dirZ * len)
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const bg = new THREE.TubeGeometry(curve, 16, 0.20, 6, false);
    const branch = new THREE.Mesh(bg, barkMat);
    branch.castShadow = true;
    tree.add(branch);
    branchEnds.push(pts[3]);
  }

  // --- 树冠（实例化叶簇，一次 draw call）---
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.92, metalness: 0.0, flatShading: true
  });
  const clusterGeo = new THREE.IcosahedronGeometry(1, 1);
  {
    const p = clusterGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const s = 0.82 + hash2(p.getX(i) * 9, p.getY(i) * 7 + p.getZ(i) * 3) * 0.4;
      p.setXYZ(i, p.getX(i) * s, p.getY(i) * s, p.getZ(i) * s);
    }
    clusterGeo.computeVertexNormals();
  }

  const canopyCount = 108;
  const tipCount = branchEnds.length * 3;
  const canopy = new THREE.InstancedMesh(clusterGeo, leafMat, canopyCount + tipCount);
  canopy.castShadow = true;
  canopy.receiveShadow = true;
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  const centerY = H * 0.92;
  let idx = 0;

  for (let i = 0; i < canopyCount; i++) {
    const a = rnd() * Math.PI * 2;
    const hh = rr(-3.2, 5.4);
    const rad = rr(1.8, 8.0) * (1 - Math.abs(hh) * 0.08);
    const px = topX + Math.cos(a) * rad * 1.15;
    const py = centerY + hh + rr(0.4, 1.5);
    const pz = topZ + Math.sin(a) * rad;
    const s = rr(1.05, 2.75);
    dummy.position.set(px, py, pz);
    dummy.scale.set(s * rr(0.9, 1.2), s * rr(0.72, 0.95), s * rr(0.9, 1.2));
    dummy.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
    dummy.updateMatrix();
    canopy.setMatrixAt(idx, dummy.matrix);
    const t = clamp01((py - (centerY - 2)) / 9);
    canopy.setColorAt(idx, col.setHSL(
      0.232 - t * 0.030 + rr(-0.012, 0.012),
      0.48 + t * 0.12,
      0.125 + t * 0.155 + rr(-0.02, 0.025)
    ));
    idx++;
  }

  // 枝端小叶簇
  branchEnds.forEach(ep => {
    for (let k = 0; k < 3; k++) {
      dummy.position.copy(ep).add(new THREE.Vector3(rr(-1.0, 1.0), rr(-0.5, 1.2), rr(-1.0, 1.0)));
      dummy.scale.setScalar(rr(0.9, 1.9));
      dummy.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
      dummy.updateMatrix();
      canopy.setMatrixAt(idx, dummy.matrix);
      canopy.setColorAt(idx, col.setHSL(0.245 + rr(-0.02, 0.02), 0.42, 0.14 + rr(0, 0.09)));
      idx++;
    }
  });
  canopy.instanceMatrix.needsUpdate = true;
  tree.add(canopy);

  scene.add(tree);
  TREE_COLLIDERS.push({ x: baseX, z: baseZ, r: 2.4 * scale });
  return tree;
}

function makeBladeGeometry() {
  const h = 1;
  const geo = new THREE.ConeGeometry(0.038, h, 4, 5, false);
  geo.translate(0, h / 2, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i), k = y / h;
    p.setX(i, p.getX(i) + k * k * 0.52);
    p.setZ(i, p.getZ(i) + k * k * 0.12);
    p.setY(i, y * (1 - k * k * 0.14));
  }
  geo.computeVertexNormals();
  return geo;
}

const capMats = {
  red:   new THREE.MeshStandardMaterial({ color: 0xa8402f, roughness: 0.86, metalness: 0.0, side: THREE.DoubleSide }),
  amber: new THREE.MeshStandardMaterial({ color: 0xc07a34, roughness: 0.88, metalness: 0.0, side: THREE.DoubleSide }),
  cream: new THREE.MeshStandardMaterial({ color: 0xbfae91, roughness: 0.9,  metalness: 0.0, side: THREE.DoubleSide })
};
const stemMat = new THREE.MeshStandardMaterial({ color: 0xd8cdb6, roughness: 0.86, metalness: 0.0 });
const dotMat  = new THREE.MeshStandardMaterial({ color: 0xded4bd, roughness: 0.8,  metalness: 0.0 });

function makeMushroom(size = 1, capKey = 'red', spots = true) {
  const g = new THREE.Group();
  const stemH = 0.95 * size;

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.105 * size, 0.175 * size, stemH, 12, 3),
    stemMat
  );
  stem.position.y = stemH / 2;
  stem.castShadow = true; stem.receiveShadow = true;
  g.add(stem);

  const capR = 0.56 * size;
  const capGeo = new THREE.SphereGeometry(capR, 26, 14, 0, Math.PI * 2, 0, Math.PI * 0.60);
  {
    const p = capGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const n = 1 + (vnoise(v.x * 3.4 + 5, v.z * 3.4 + v.y * 3.1) - 0.5) * 0.16;
      p.setXYZ(i, v.x * n, v.y * n, v.z * n);
    }
    capGeo.computeVertexNormals();
  }
  const cap = new THREE.Mesh(capGeo, capMats[capKey]);
  cap.position.y = stemH * 0.97;
  cap.scale.y = 0.86;
  cap.castShadow = true; cap.receiveShadow = true;
  g.add(cap);

  // 菌盖下沿的褶皱边
  const skirt = new THREE.Mesh(
    new THREE.TorusGeometry(capR * 0.965, 0.045 * size, 6, 26),
    capMats[capKey]
  );
  skirt.position.y = stemH * 0.97;
  skirt.rotation.x = Math.PI / 2;
  skirt.castShadow = true;
  g.add(skirt);

  if (spots) {
    const dotGeo = new THREE.SphereGeometry(0.055 * size, 8, 6);
    const n = ri(6, 12);
    for (let i = 0; i < n; i++) {
      const theta = rr(0.05, 0.86) * Math.PI * 0.62;
      const phi = rnd() * Math.PI * 2;
      const R = capR * 1.0;
      const d = new THREE.Mesh(dotGeo, dotMat);
      d.position.set(
        Math.sin(theta) * Math.cos(phi) * R * 0.99,
        stemH * 0.97 + Math.cos(theta) * R * 0.86 * 0.99,
        Math.sin(theta) * Math.sin(phi) * R * 0.99
      );
      const s = rr(0.7, 1.5);
      d.scale.set(s, s * 0.45, s);
      d.lookAt(0, stemH * 0.97 + R * 0.9, 0);
      d.castShadow = true;
      g.add(d);
    }
  }

  // 菌盖上的露珠
  if (size > 0.8) {
    for (let i = 0; i < 2; i++) {
      const th = rr(0.15, 0.55) * Math.PI * 0.62, ph = rnd() * 6.28;
      const drop = makeDew(rr(0.042, 0.075) * size, true);
      drop.position.set(
        Math.sin(th) * Math.cos(ph) * capR * 0.94,
        stemH * 0.97 + Math.cos(th) * capR * 0.86 * 0.94,
        Math.sin(th) * Math.sin(ph) * capR * 0.94
      );
      g.add(drop);
    }
  }
  return g;
}

/* =========================================================
   12. 落叶
   ========================================================= */
function makeLeafGeometry() {
  const geo = new THREE.PlaneGeometry(1, 1, 10, 10);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i);           // -0.5 .. 0.5
    const t = p.getY(i) + 0.5;     // 0(叶柄) .. 1(叶尖)
    const w = Math.sin(Math.PI * Math.pow(t, 0.58)) * 0.95;
    const x = u * w;
    const y = t;
    const z = Math.pow(Math.abs(u) * 1.06, 1.8) * 0.5 + Math.pow(t, 3.2) * 0.16;
    p.setXYZ(i, x, y, z);
  }

function createAnt() {
  const root = new THREE.Group();

  waist.position.set(-0.040, 0.078, 0);

  thorax.position.set(0.012, 0.084, 0);
  thorax.scale.set(1.08, 1.02, 0.96);

  const neck = new THREE.Mesh(new THREE.SphereGeometry(0.030, 10, 8), antJointMat);
  neck.position.set(0.062, 0.088, 0);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.066, 14, 10), antBodyMat);
  head.position.set(0.108, 0.092, 0);
  head.scale.set(1.02, 0.98, 1.06);
  body.add(head);

  // 上颚
  for (const s of [-1, 1]) {
    const mand = new THREE.Mesh(new THREE.ConeGeometry(0.013, 0.05, 5), antBodyMat);
    mand.position.set(0.168, 0.080, s * 0.024);
    mand.rotation.z = -Math.PI / 2 + s * 0.22;
    mand.rotation.x = s * 0.4;
    body.add(mand);
  }

  // 复眼
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.016, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0x05040a, roughness: 0.08, metalness: 0.6 })
    );
    eye.position.set(0.138, 0.106, s * 0.048);
    body.add(eye);
  }

  // 触角
  const antennae = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(0.148, 0.126, s * 0.028);
    body.add(pivot);
    const seg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.013, 0.115, 6), antJointMat);
    seg1.position.y = 0.0575;
    pivot.add(seg1);
    const joint = new THREE.Group();
    joint.position.y = 0.115;
    joint.rotation.z = 0.75;
    joint.rotation.x = s * 0.3;
    pivot.add(joint);
    const seg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.010, 0.10, 6), antJointMat);
    seg2.position.y = 0.05;
    joint.add(seg2);
    pivot.rotation.z = -0.55;
    pivot.rotation.x = s * 0.32;
    antennae.push(pivot);
  }

  // 六条腿：splay 控制左右张开，pivot 控制前后摆动
  const legs = [];
  const legGeo = new THREE.CylinderGeometry(0.012, 0.008, 0.120, 6);
  legGeo.translate(0, -0.060, 0);
  const kneeGeo = new THREE.CylinderGeometry(0.008, 0.0045, 0.078, 5);
  kneeGeo.translate(0, -0.039, 0);

  const anchor = [[-0.045, 1.0], [0.012, 0.0], [0.058, -1.0]];
  anchor.forEach(([ax, ph]) => {
    for (const s of [-1, 1]) {
      const splay = new THREE.Group();
      splay.position.set(ax, 0.078, s * 0.040);
      splay.rotation.x = -s * 0.92;
      body.add(splay);

      const pivot = new THREE.Group();
      pivot.rotation.z = ph * 0.28;
      splay.add(pivot);

      const upper = new THREE.Mesh(legGeo, antJointMat);
      pivot.add(upper);

      const knee = new THREE.Group();
      knee.position.y = -0.120;
      knee.rotation.x = s * 1.05;
      pivot.add(knee);

      const lower = new THREE.Mesh(kneeGeo, antJointMat);
      lower.rotation.x = -s * 0.55;
      knee.add(lower);

      legs.push({ pivot, s, ph });
    }
  });

  root.userData = { body, legs, antennae, head };
  return root;
}

// 沿光柱轴线采样，判断这根光柱是否会穿过树干
function beamHitsTree(cx, cy, cz, h) {
  for (let s = -0.5; s <= 0.5001; s += 0.07) {
    const px = cx + lightDir.x * h * s;
    const pz = cz + lightDir.z * h * s;
    for (let i = 0; i < TREE_COLLIDERS.length; i++) {
      const t = TREE_COLLIDERS[i];
      if (Math.hypot(px - t.x, pz - t.z) < t.r + 0.35) return true;
    }
  }
  return false;
}

  const pos = new Float32Array(N * 3);
  const seedArr = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = rr(-20, 20);
    pos[i * 3 + 1] = rr(0.2, 13);
    pos[i * 3 + 2] = rr(-20, 20);
    seedArr[i] = rnd() * 100;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.055,
    map: makeDustTexture(),
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    color: 0xfff2cf
  });
  const dust = new THREE.Points(geo, mat);
  dust.userData.seed = seedArr;
  dust.userData.basePos = pos.slice();
  scene.add(dust);
  window.__dust = dust;
}

/* =========================================================
   21. 飘落的叶子
   ========================================================= */
const fallingLeaves = [];
for (let i = 0; i < 9; i++) {
  const geo = leafGeo.clone();
  const mat = new THREE.MeshStandardMaterial({
    color: leafPalette[ri(0, leafPalette.length - 1)],
    roughness: 0.8, metalness: 0, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(geo, mat);
  const s = rr(0.16, 0.30);
  m.scale.setScalar(s);
  m.position.set(rr(-14, 12), rr(6, 13), rr(-10, 10));
  m.castShadow = false;
  scene.add(m);
  fallingLeaves.push({
    mesh: m,
    vy: rr(-0.42, -0.20),
    spinX: rr(-1.1, 1.1),
    spinY: rr(-0.8, 0.8),
    spinZ: rr(-1.4, 1.4),
    swayPhase: rnd() * 6.28,
    swayAmp: rr(0.25, 0.7)
  });
}

/* =========================================================
   22. 后期处理
   ========================================================= */
let composer = null;
let bloomPass = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.22, 0.55, 0.92
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
} catch (e) {
  console.warn('后期处理初始化失败，回退到直接渲染', e);
  composer = null;
}

/* =========================================================
   23. 动画循环
   ========================================================= */
const clock = new THREE.Timer();
let paused = false;
let elapsed = 0;

function updateAnts(dt, time) {
  for (let i = 0; i < ants.length; i++) {
    const ant = ants[i];
    const u = ant.userData;
    u.t += u.speed * dt;
    if (u.t > 1) u.t -= 1;

    const { p, tan, tt } = samplePath(u.t);

    // 朝向路径切线（模型朝 +X）
    const ang = Math.atan2(-tan.z, tan.x);
    let dy = ang - ant.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    ant.rotation.y += dy * Math.min(1, dt * 9);

    // ---- 贴地：地形 + 蚁穴土丘高度场 ----
    let scl = 1;
    let pitch = 0;

    if (tt > 0.962) {
      // 走到洞口唇边后：向洞心收拢，沿实体漏斗壁下潜
      const k = smooth(0.962, 1.0, tt);
      p.x += (HOLE.x - p.x) * k * 0.985;
      p.z += (HOLE.z - p.z) * k * 0.985;
      p.y = surfaceHeight(p.x, p.z) + 0.05;
      scl = 1 - k * 0.93;
      pitch = Math.atan2(-0.9, 1.0) * k;      // 低头钻洞
    } else {
      p.y = surfaceHeight(p.x, p.z) + 0.05;
      // 上坡时身体前倾 / 下坡时抬头
      const d = 0.28;
      const aheadY = surfaceHeight(p.x + tan.x * d, p.z + tan.z * d);
      const hereY = surfaceHeight(p.x, p.z);
      pitch = Math.atan2(aheadY - hereY, d) * 0.85;
      // 起点淡入
      if (tt < 0.022) scl = smooth(0, 0.022, tt) * 0.98 + 0.02;
    }

    const baseScale = ant.userData.baseScale;
    ant.scale.setScalar(baseScale * scl);
    ant.visible = scl > 0.03;

    p.y += Math.max(0, Math.sin(time * 9 + u.phase)) * 0.006;
    ant.position.copy(p);

    // 步态：身体起伏 + 侧摆 + 坡度俯仰
    const body = ant.userData.body;
    body.position.y = Math.sin(time * 11 + u.phase) * 0.006;
    body.rotation.z = pitch + Math.sin(time * 5.5 + u.phase) * 0.038;
    body.rotation.y = Math.sin(time * 5.5 + u.phase + 1.2) * 0.028;

    // 腿部摆动（绕 Z 轴前后摆）
    const legs = u.legs;
    for (let k = 0; k < legs.length; k++) {
      const L = legs[k];
      const swing = Math.sin(time * 12 + u.phase + L.ph * 1.9 + (L.s > 0 ? 0 : Math.PI)) * 0.40;
      L.pivot.rotation.z = L.ph * 0.28 + swing;
    }

    // 触角抖动
    u.antennae.forEach((a, idx) => {
      a.rotation.x = (idx === 0 ? 1 : -1) * 0.32 + Math.sin(time * 3.2 + u.phase + idx) * 0.16;
    });
  }
}

function updateFallingLeaves(dt, time) {
  for (const f of fallingLeaves) {
    const m = f.mesh;
    m.position.y += f.vy * dt;
    m.position.x += Math.sin(time * 0.8 + f.swayPhase) * f.swayAmp * dt;
    m.position.z += Math.cos(time * 0.65 + f.swayPhase) * f.swayAmp * 0.7 * dt;
    m.rotation.x += f.spinX * dt;
    m.rotation.y += f.spinY * dt;
    m.rotation.z += f.spinZ * dt;

    const gy = terrainHeight(m.position.x, m.position.z) + 0.03;
    if (m.position.y < gy) {
      m.position.set(rr(-16, 14), rr(9, 14), rr(-12, 12));
      m.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6);
    }
  }
}

function updateDust(dt, time) {
  const dust = window.__dust;
  if (!dust) return;
  const pos = dust.geometry.attributes.position;
  const base = dust.userData.basePos;
  for (let i = 0; i < pos.count; i++) {
    const s = dust.userData.seed[i];
    const bx = base[i * 3], by = base[i * 3 + 1], bz = base[i * 3 + 2];
    pos.setX(i, bx + Math.sin(time * 0.35 + s) * 0.55);
    pos.setY(i, by + Math.sin(time * 0.22 + s * 1.7) * 0.45 + ((time * 0.10 + s * 3.1) % 1.2));
    pos.setZ(i, bz + Math.cos(time * 0.30 + s * 1.3) * 0.5);
  }
  pos.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  clock.update();
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!paused) {
    elapsed += dt;
    updateAnts(dt, elapsed);
    updateFallingLeaves(dt, elapsed);
    updateDust(dt, elapsed);
  }

  // 光束呼吸
  beamGroup.children.forEach((b, i) => {
    const base = b.material.userData.baseOpacity;
    b.material.opacity = base * (0.72 + Math.sin(elapsed * 0.35 + i * 1.7) * 0.28);
  });

  controls.update();

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* =========================================================
   24. 交互 & 自适应
   ========================================================= */
const btnRotate = document.getElementById('btnRotate');
const btnPause = document.getElementById('btnPause');

btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('on', controls.autoRotate);
});

btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? '继续' : '暂停';
  btnPause.classList.toggle('on', paused);
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
});

// 用户交互时暂停自动旋转，静止 2.5s 后恢复
let resumeTimer = null;
controls.addEventListener('start', () => {
  if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
  controls.autoRotate = false;
});
controls.addEventListener('end', () => {
  if (!btnRotate.classList.contains('on')) return;
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 2500);
});

/* =========================================================
   25. 启动
   ========================================================= */
window.__forest = { scene, camera, controls, renderer, ants };

animate();

requestAnimationFrame(() => {
  setTimeout(() => {
    document.getElementById('loading').classList.add('hide');
  }, 260);
});
</script>
